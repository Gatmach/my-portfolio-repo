name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 22
  WORKING_DIR: portfolio

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build

  docker:
    name: Validate Docker
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env from template for CI
        run: |
          if [ -f server/.env.example ]; then
            cp server/.env.example server/.env
            echo "✅ Created .env from .env.example"
          else
            echo "⚠️  No .env.example found, creating minimal .env"
            cat > server/.env << 'EOF'
          EMAIL_USER=ci_test@example.com
          EMAIL_PASS=ci_test_password
          EMAIL_HOST=smtp.example.com
          EMAIL_PORT=587
          PORT=5000
          NODE_ENV=production
          EOF
          fi
          echo "📄 .env file contents (values redacted):"
          grep -v "PASS\|SECRET\|KEY\|TOKEN" server/.env 2>/dev/null || cat server/.env

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker images
        run: docker compose build